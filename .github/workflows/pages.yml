name: Build and deploy Cotiful
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore initial source package
        if: hashFiles('cotiful-source.zip') != ''
        run: |
          unzip -q cotiful-source.zip -d "$RUNNER_TEMP/cotiful-source"
          cp -R "$RUNNER_TEMP/cotiful-source/cotiful/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm cotiful-source.zip
          git add app components lib public package.json package-lock.json next.config.ts tsconfig.json eslint.config.mjs postcss.config.mjs .gitignore README.md
          git commit -m "Restore complete Cotiful source tree"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /cotiful
          NEXT_PUBLIC_SITE_URL: https://furkanzagli.github.io/cotiful
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
